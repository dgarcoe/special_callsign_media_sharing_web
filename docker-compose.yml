services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - app_data:/data
    environment:
      - DB_PATH=/data/media.db
      - MEDIA_DIR=/data/media
      - ADMIN_PASSWORD_HASH=${ADMIN_PASSWORD_HASH:-8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918}
      - APP_TITLE=${APP_TITLE:-Special Callsign Media Sharing}
    networks:
      - internal

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - internal

volumes:
  app_data:

networks:
  internal:
    driver: bridge
