services:
  media-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: quendaward-media
    restart: unless-stopped
    volumes:
      - media_data:/data
      - ${QUENDAWARD_DATA_DIR:-./data}:/quendaward_data:ro
    environment:
      - QUENDAWARD_DB_PATH=/quendaward_data/ham_coordinator.db
      - MEDIA_DB_PATH=/data/media.db
      - MEDIA_DIR=/data/media
      - APP_TITLE=${APP_TITLE:-Special Callsign Media Sharing}
      - STREAMLIT_SERVER_BASE_URL_PATH=/quendaward_media
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    networks:
      - quendaward-network

volumes:
  media_data:

networks:
  quendaward-network:
    external: true
    name: ${QUENDAWARD_NETWORK_NAME:-ea1rfi-network}
